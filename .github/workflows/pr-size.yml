name: PR Size

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  size:
    name: Classify PR size
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Label PR by changed lines
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const SIZES = [
              { name: "size/xs", max: 10, color: "3cbf00", description: "Under 10 changed lines" },
              { name: "size/small", max: 100, color: "5d9801", description: "10-99 changed lines" },
              { name: "size/medium", max: 300, color: "7f7203", description: "100-299 changed lines" },
              { name: "size/large", max: 700, color: "a14c05", description: "300-699 changed lines" },
              { name: "size/x-large", max: 1500, color: "c32607", description: "700-1499 changed lines" },
              { name: "size/excess", max: Infinity, color: "e50009", description: "1500+ changed lines: split this PR" },
            ];
            const GENERATED = [/^package-lock\.json$/, /^public\/r\//, /^r\//, /^registry\.json$/];
            const MARKER = "<!-- pr-size-excess -->";

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: issue_number, per_page: 100 });
            const counted = files.filter((file) => !GENERATED.some((pattern) => pattern.test(file.filename)));
            const lines = counted.reduce((total, file) => total + file.additions + file.deletions, 0);
            const size = SIZES.find((entry) => lines < entry.max);
            core.info(`${lines} changed lines across ${counted.length} files (${files.length - counted.length} generated files ignored): ${size.name}`);

            for (const entry of SIZES) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: entry.name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name: entry.name, color: entry.color, description: entry.description });
              }
            }

            const current = context.payload.pull_request.labels.map((label) => label.name);
            for (const name of current.filter((name) => name.startsWith("size/") && name !== size.name)) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
            }
            if (!current.includes(size.name)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [size.name] });
            }

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((comment) => comment.user.type === "Bot" && comment.body.includes(MARKER));
            if (size.name === "size/excess" && !existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: `${MARKER}\nThis PR changes ${lines} lines (generated registry files and the lockfile are not counted). PRs over 1500 lines are hard to review safely. Please split it into smaller PRs that can each be reviewed and merged on their own. See [PR size](https://github.com/${owner}/${repo}/blob/main/CONTRIBUTING.md#pr-size).`,
              });
            } else if (size.name !== "size/excess" && existing) {
              await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
            }
