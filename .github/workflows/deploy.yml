name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image-tag:
        description: Full commit SHA of a published image to redeploy, for a rollback. Leave empty to build and deploy the selected branch.
        required: false
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions: {}

env:
  IMAGE_NAME: ghcr.io/devclub-nstru/component_library

jobs:
  image:
    name: Build and push image
    if: inputs.image-tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username github-actions --password-stdin

      - name: Build and push image
        id: build
        run: |
          docker buildx create --use --driver docker-container
          docker buildx build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE_NAME:$GITHUB_SHA" \
            --cache-from "type=registry,ref=$IMAGE_NAME:buildcache" \
            --cache-to "type=registry,ref=$IMAGE_NAME:buildcache,mode=max" \
            --metadata-file metadata.json \
            --push \
            .
          echo "digest=$(jq -r '."containerimage.digest"' metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io

  deploy:
    name: Deploy to VPS
    needs: image
    if: ${{ !cancelled() && (needs.image.result == 'success' || needs.image.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://ui.devclubxnst.com
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout deploy script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/deploy-vps.sh
          sparse-checkout-cone-mode: false

      - name: Resolve image reference
        id: image
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          REQUESTED_TAG: ${{ inputs.image-tag }}
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            if ! [[ "$REQUESTED_TAG" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::image-tag must be a full 40-character lowercase commit SHA."
              exit 1
            fi
            ref="$IMAGE_NAME:$REQUESTED_TAG"
          else
            ref="$IMAGE_NAME@$DIGEST"
          fi
          echo "Deploying $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
        run: |
          for name in VPS_HOST VPS_USERNAME VPS_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::The $name secret is not set on the production environment."
              exit 1
            fi
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_SSH_PORT" -H "$VPS_HOST" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            Port $VPS_SSH_PORT
            User $VPS_USERNAME
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 4
          EOF

      - name: Log the VPS in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | ssh vps docker login ghcr.io --username github-actions --password-stdin

      - name: Deploy container
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: ssh vps bash -s -- "$IMAGE_REF" < scripts/deploy-vps.sh

      - name: Log the VPS out of GitHub Container Registry
        if: always()
        run: ssh vps docker logout ghcr.io || true

      - name: Check the public site
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --max-time 15 https://ui.devclubxnst.com/api/health
