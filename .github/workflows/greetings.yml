name: Greetings

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  greeting:
    name: First interaction
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Welcome first-time contributor
        uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
        with:
          issue_message: "Thanks for opening your first issue in DevClub UI! A maintainer will triage it soon. Please make sure the template is filled in so we can reproduce it."
          pr_message: "Thanks for your first pull request to DevClub UI! Please read the [Contributing Guide](https://github.com/devclub-nstru/component_library/blob/main/CONTRIBUTING.md). CI runs once a maintainer approves the workflow run, and every PR needs two maintainer approvals before it can merge."
