name: "Greetings"

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    name: First Interaction
    runs-on: ubuntu-latest
    steps:
      - name: Welcome first-time contributor
        uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "👋 Thanks for opening your first issue in DevClub UI! A maintainer will review it soon. Please make sure you have provided all relevant details to help us investigate."
          pr-message: "🎉 Welcome and thank you for opening your first pull request in DevClub UI! Please ensure your changes comply with our [Contributing Guide](CONTRIBUTING.md) and pass all automated CI checks."
