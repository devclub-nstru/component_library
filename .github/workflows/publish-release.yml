name: Publish Release

on:
  push:
    branches:
      - release

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: Tag and publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release only contains commits from main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::release must point at a commit that is already on main. Fast-forward it with: git push origin <main-sha>:release"
            exit 1
          fi

      - name: Check the version is new
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if gh release view "$version" >/dev/null 2>&1 || git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "::error::$version already exists. Bump the version in package.json through a PR to main before releasing."
            exit 1
          fi
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          package-manager-cache: false

      - name: Pack npm tarball and checksums
        run: |
          npm run registry:sync
          npm pack --ignore-scripts
          sha256sum devclubnst-ui-*.tgz > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: SHA256SUMS
          create-storage-record: false

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          notes="Functional and security changes: [CHANGELOG.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md).

          Verify the tarball: \`sha256sum -c SHA256SUMS\` and \`gh attestation verify devclubnst-ui-${TAG#v}.tgz --repo ${GITHUB_REPOSITORY}\`."
          gh release create "$TAG" devclubnst-ui-*.tgz SHA256SUMS --target "$GITHUB_SHA" --title "$TAG" --notes "$notes" --generate-notes
