name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: "🚀 New Components & Primitives"
    labels:
      - "area/components"
      - "component-proposal"
  - title: "✨ Enhancements & Features"
    labels:
      - "enhancement"
  - title: "🐛 Bug Fixes"
    labels:
      - "bug"
  - title: "⚡ Performance & Animations"
    labels:
      - "performance"
  - title: "📝 Documentation"
    labels:
      - "documentation"
      - "area/docs"
  - title: "🛠️ Maintenance & Tooling"
    labels:
      - "chore"
      - "dependencies"
      - "ci"
change-template: "- $TITLE (#$NUMBER) by @$AUTHOR"
version-resolver:
  major:
    labels:
      - "major"
      - "breaking-change"
  minor:
    labels:
      - "minor"
      - "enhancement"
      - "component-proposal"
  patch:
    labels:
      - "patch"
      - "bug"
  default: patch
template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/devclub-nstru/component_library/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
